; Ajuste do pool do PHP-FPM — carregado depois do zz-docker.conf da imagem oficial (ordem
; alfabética), então sobrescreve o padrão. Os valores vêm do ambiente (docker-compose*.yml,
; com padrão no docker/app-entrypoint.sh), pra calibrar dev e produção sem rebuild.
;
; O padrão da imagem era pm.max_children = 5: com o console SQL deixando uma consulta rodar
; até 10s (Database::CONSOLE_MAX_EXECUTION_MS), cinco alunos rodando ao mesmo tempo
; travavam a app inteira pra todo mundo (fila no nginx). Cada worker fica em ~20-40MB, então
; FPM_MAX_CHILDREN x 40MB tem que caber no limite de memória do container (APP_MEM_LIMIT).
[www]
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${FPM_MAX_SPARE_SERVERS}
; Recicla o worker depois de N requisições: qualquer vazamento de memória (extensão, lib)
; fica limitado em vez de crescer até o container bater no limite e ser morto pelo OOM.
pm.max_requests = 500
; Requisição presa (ex.: cURL sem resposta) não segura um worker pra sempre.
request_terminate_timeout = 120s
