server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # IP real do visitante (rate limit por IP, ver App\Support\ClientIp, que só lê
    # REMOTE_ADDR). O TLS termina no Nginx Proxy Manager, então a conexão que chega aqui é
    # sempre do proxy. X-Forwarded-For só é aceito quando o peer é uma rede privada (o NPM,
    # pela rede docker 'proxy' — este container não publica porta em produção), e
    # real_ip_recursive pega o IP mais à DIREITA da cadeia que não é proxy: o que o NPM
    # acrescentou, não o que o cliente escreveu à esquerda. Antes o PHP pegava o primeiro
    # IP da cadeia, que é justamente o forjável.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Cabeçalhos de segurança — "always" pra sair também em respostas de erro (403/404/50x),
    # não só 2xx. Nginx NÃO herda add_header de um location pra outro que já tenha o seu
    # próprio (ver /build/ abaixo) — por isso reaparecem lá.
    #
    # script-src precisa de 'unsafe-eval': Alpine.js usa `Function()` pra avaliar as
    # expressões dos atributos (x-data, @click, etc.) — é assim que a biblioteca funciona,
    # não dá pra tirar sem trocar de framework. style-src precisa de 'unsafe-inline' pelo
    # mesmo motivo: o laboratório de modelagem (ver Alpine `erLab` em resources/js/app.js)
    # posiciona as caixas arrastáveis via `:style` (left/top calculados em JS) — sem
    # 'unsafe-inline' o navegador aceita a mudança no atributo `style` mas recusa aplicá-la
    # visualmente, então as entidades ficam "presas" no canto do quadro. Ainda assim a CSP
    # bloqueia o de sempre: script/estilo/fonte de origem externa e qualquer <script>
    # injetado via XSS — 'unsafe-inline' aqui é só sobre ESTILO, não sobre script.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Propaga o proto original (o Nginx Proxy Manager termina o TLS e sobrescreve esse
        # header) — usado por App\Support\RequestScheme (cookie Secure).
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        # O IP real já chega em REMOTE_ADDR (real_ip, acima). O X-Forwarded-For cru vai
        # vazio pro PHP pra ninguém voltar a confiar nele por engano.
        fastcgi_param HTTP_X_FORWARDED_FOR "";
    }

    # Assets versionados pelo Vite (nome tem hash) — cache agressivo é seguro.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # app/ (controllers, views, etc.) fica fora do docroot; isso aqui é defesa extra
    # contra qualquer arquivo de config/dotfile que acabe indo parar em public/.
    location ~ /\. {
        deny all;
    }
}
