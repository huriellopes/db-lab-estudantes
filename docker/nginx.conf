server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    access_log /dev/stdout;
    error_log /dev/stderr;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Propaga o proto e o IP originais (o Nginx Proxy Manager termina o TLS e faz o
        # proxy na frente deste container) — usado por App\Support\RequestScheme (cookie
        # Secure) e App\Support\ClientIp (rate limiting por IP real, não o do proxy).
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    }

    # Assets versionados pelo Vite (nome tem hash) — cache agressivo é seguro.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # app/ (controllers, views, etc.) fica fora do docroot; isso aqui é defesa extra
    # contra qualquer arquivo de config/dotfile que acabe indo parar em public/.
    location ~ /\. {
        deny all;
    }
}
