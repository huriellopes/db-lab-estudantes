; Performance do PHP. Os valores com ${...} vêm do ambiente (ver docker-compose*.yml).

; OPcache: o código mora dentro da imagem e não muda com o container rodando (deploy =
; imagem nova = container novo), então em produção não precisa checar a data de cada arquivo
; a cada requisição (OPCACHE_VALIDATE_TIMESTAMPS=0). Em dev fica 1, pra quem montar o código
; por volume ver a mudança na hora. Templates do Twig continuam corretos com 0: o
; FilesystemCache do Twig chama opcache_invalidate() ao regravar um template compilado. Se
; algo "não pegar", /admin/manutencao tem "Resetar OPcache".
opcache.enable = 1
opcache.validate_timestamps = ${OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 2
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
; vendor/ + app/ + templates compilados do Twig passam fácil dos 10000 do padrão.
opcache.max_accelerated_files = 20000
; JIT fica desligado de propósito: em app web que passa a maior parte do tempo esperando o
; MySQL, o ganho é quase nulo e custa memória por worker.
opcache.jit = disable

; Cache de caminhos resolvidos (include/require do autoload do Composer).
realpath_cache_size = 4096K
realpath_cache_ttl = 600
