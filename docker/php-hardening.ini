; Nunca mostrar erro na resposta HTTP (stack trace, caminho de arquivo, etc.) — só logar.
; Vale pra dev e produção igual (mesma imagem nos dois, de propósito — ver Dockerfile):
; erro em dev sempre foi depurado via `docker logs`, nunca no navegador, então isso não
; muda o fluxo de trabalho, só fecha um vazamento de informação real em produção.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Some o header "X-Powered-By: PHP/x.y.z" — não ajuda ninguém e só entrega a versão exata
; rodando pra quem for procurar CVE conhecida.
expose_php = Off

; Sem isso o PHP assume UTC pra tudo (date(), DateTimeImmutable sem timezone explícito,
; etc.) — os "criado em"/"atualizado em" que aparecem na app (dashboard, admin, consultas
; salvas, diagramas do laboratório...) ficavam 3h adiantados em relação ao horário real do
; Brasil. Combina com --default-time-zone=America/Sao_Paulo do MySQL (ver docker-compose*.yml)
; — sem os dois juntos, um dos lados ainda ficaria errado.
date.timezone = America/Sao_Paulo
