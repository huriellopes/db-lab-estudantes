name: CI

# Roda em toda branch de feature (via PR) e nas duas branches "guarda-chuva" (dev/main),
# pra garantir que nada quebrado chega nem na dev nem na main.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP — testes e padrão de código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql, mysqli
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      # Falha o CI se alguma dependência PHP do composer.lock tiver vulnerabilidade
      # conhecida (base de advisories do Packagist/GitHub).
      - name: Auditoria de dependências (composer audit)
        run: composer audit --locked

      - name: Testes (Pest)
        run: composer test

      - name: Padrão de código (PHP-CS-Fixer)
        run: composer cs

      - name: php -l em tudo
        run: |
          find app public bin database tests -name '*.php' -print0 | xargs -0 -n1 php -l

  js:
    name: JS/CSS — build e formatação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      # Só as dependências que vão pro bundle do navegador (Alpine, Axios) — as de build
      # (Vite, Tailwind, Prettier) não rodam em produção. Foi assim que apareceu o Axios
      # 1.19.0 com advisories altas (prototype pollution, header injection).
      - name: Auditoria de dependências (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Build do Vite
        run: npm run build

  docker:
    name: Docker — a imagem de produção builda
    runs-on: ubuntu-latest
    needs: [php, js]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build da imagem (sem push — só valida que o Dockerfile builda)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          tags: db-lab-estudantes-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  load-test:
    name: Teste de carga (k6)
    runs-on: ubuntu-latest
    needs: [docker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Ambiente descartável, só pra esse job — nunca as credenciais reais de dev/produção
      # (essas ficam só no .env local/no servidor, fora do git; ver README.md).
      - name: Gera .env descartável pro docker compose
        run: |
          cat > .env <<EOF
          MYSQL_ROOT_PASSWORD=ci_root_$(openssl rand -hex 8)
          MYSQL_DATABASE=schoolapp
          MYSQL_USER=appuser
          MYSQL_PASSWORD=ci_app_$(openssl rand -hex 8)
          APP_PORT=8080
          PMA_PORT=8081
          MYSQL_PORT=3307
          PMA_URL=http://localhost:8081
          DB_PUBLIC_HOST=localhost
          APP_KEY=$(openssl rand -base64 32)
          MAIL_HOST=
          MAIL_PORT=587
          MAIL_USERNAME=
          MAIL_PASSWORD=
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS=
          MAIL_FROM_NAME="DB Lab Estudantes"
          EOF

      # Só mysql+app (phpmyadmin não entra no tráfego testado, não precisa subir).
      - name: Sobe mysql + app
        run: docker compose up -d --build mysql app

      - name: Espera a app responder (migrations rodam no entrypoint)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/login; then
              echo "App no ar (tentativa $i)."
              exit 0
            fi
            echo "App ainda não respondeu, tentando de novo em 2s... (tentativa $i)"
            sleep 2
          done
          echo "App não respondeu a tempo." >&2
          docker compose logs app
          exit 1

      - name: Instala k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      - name: Roda o teste de carga
        run: k6 run k6/load-test.js
        env:
          BASE_URL: http://localhost:8080

      - name: Logs da app (se algo falhar)
        if: failure()
        run: docker compose logs app mysql

      - name: Derruba o ambiente
        if: always()
        run: docker compose down -v
