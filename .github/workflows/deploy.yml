name: Deploy

# Só dispara depois que o workflow "CI" terminar com sucesso NA main — ou seja, só depois
# que testes, padrão de código e o build do Vite/Docker passarem. dev nunca deploya.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy em produção
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - name: Rodar deploy.sh via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # O servidor ignora este comando: a chave de deploy tem command="..." no
          # authorized_keys, fixando qual script roda (ver README, "Produção"). Por isso o
          # caminho real do script não precisa (nem deve) aparecer aqui.
          script: deploy
