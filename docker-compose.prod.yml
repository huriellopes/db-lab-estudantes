# Stack de produção: app e phpMyAdmin são publicados por um proxy reverso já existente no
# servidor (que termina o TLS), através da rede externa 'proxy' — declarada abaixo, sem
# precisar de `docker network connect` manual depois do `up`.
#
# O MySQL aceita conexão direta, de propósito, pra alunos usarem o SGBD que preferirem —
# as camadas que protegem isso estão no SECURITY.md ("MySQL acessível diretamente").
services:
  mysql:
    image: mysql:8.0.46
    container_name: dblab-mysql
    restart: unless-stopped
    # --default-time-zone: fuso do servidor (afeta NOW()/CURRENT_TIMESTAMP e toda coluna
    # TIMESTAMP — inclusive nos schemas dos alunos, já que é uma configuração do servidor,
    # não por database). "America/Sao_Paulo" em vez de um offset fixo tipo "-03:00" porque
    # segue o fuso de verdade (o Brasil não tem horário de verão desde 2019, mas se voltar
    # um dia, esse nome já lida sozinho — testado: a imagem oficial do MySQL já carrega as
    # tabelas de fuso horário sozinha, não precisa de mysql_tzinfo_to_sql manual).
    #
    # connection_control: depois de 5 senhas erradas seguidas pro mesmo usuário vindo do mesmo
    # host, cada nova tentativa espera 1s, 2s, 3s... (até 30s). Com a porta pública, é o que
    # torna força bruta de senha impraticável — sem travar a conta: o aluno legítimo, de
    # outro IP, não é afetado (FAILED_LOGIN_ATTEMPTS bloquearia a conta inteira por dias, e
    # aí qualquer um travaria o console/phpMyAdmin de um colega errando a senha dele de
    # propósito). Tentativas atrasadas: information_schema.connection_control_failed_login_attempts.
    # "--loose-" é obrigatório: na criação de um volume novo (--initialize) o MySQL ainda não
    # carregou o plugin, e sem o prefixo aborta com "unknown variable" em vez de só avisar.
    #
    # log-bin-trust-function-creators: com o binary log ligado (padrão do MySQL 8), só quem tem
    # SUPER cria TRIGGER/FUNCTION (erro 1419) — e aluno não tem, então nenhum exemplo de trigger
    # do /guia rodava no laboratório. A trava existe pra replicação baseada em comandos
    # (binlog_format=STATEMENT); aqui é ROW e não há réplica. O trigger continua rodando com as
    # permissões do próprio aluno (DEFINER = ele mesmo), só no schema dele.
    #
    # Performance (calibrado com docker/prod-diagnose.sh): os dados do lab são pequenos (dezenas
    # de MB), então o buffer pool padrão de 128M já cabe tudo em memória — ajustável por
    # MYSQL_INNODB_BUFFER_POOL_SIZE se crescer (regra: ~tamanho dos dados + folga, e bem abaixo
    # de MYSQL_MEM_LIMIT). O_DIRECT: o InnoDB já faz cache próprio; sem isso os mesmos dados
    # ficavam duas vezes na RAM (buffer pool + cache de página do kernel). Binlog: sem réplica,
    # só serve pra recuperação recente — 7 dias em vez dos 30 do padrão.
    command: >-
      --default-authentication-plugin=mysql_native_password
      --default-time-zone=America/Sao_Paulo
      --plugin-load-add=connection_control.so
      --loose-connection-control-failed-connections-threshold=5
      --loose-connection-control-min-connection-delay=1000
      --loose-connection-control-max-connection-delay=30000
      --log-bin-trust-function-creators=1
      --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-128M}
      --innodb-flush-method=O_DIRECT
      --binlog-expire-logs-seconds=604800
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Root só via socket/localhost de dentro do container (healthcheck, manutenção com
      # `docker compose exec`). Sem isso a imagem cria root@'%' — senha de root aberta pra
      # força bruta na porta pública. Só vale na criação do volume (em volume antigo, revise
      # as contas root em mysql.user).
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - dblab-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    # Porta configurável (MYSQL_PORT) pra não colidir com outros serviços do servidor.
    # Pública de propósito — conexão direta por SGBD local.
    ports:
      - "${MYSQL_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem isso, o log do container (docker logs) cresce sem limite — em anos de uptime,
    # disco cheio derruba o servidor inteiro, não só esta app.
    # 10MB x 3 arquivos por serviço é bastante pra debugar sem virar risco de disco cheio.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Limites de recurso: o servidor é compartilhado com outros projetos e, antes, NENHUM
    # container tinha limite — um vazamento aqui podia levar o host inteiro pro OOM. Valores
    # medidos com docker/prod-diagnose.sh (MySQL ~460MB, app ~50MB ocioso) + folga pra pico;
    # ajustáveis no .env sem mexer neste arquivo.
    deploy:
      resources:
        limits:
          cpus: "${MYSQL_CPUS:-2.0}"
          memory: ${MYSQL_MEM_LIMIT:-1G}
    networks:
      - dblab-net

  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: dblab-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    # Só em 127.0.0.1 (acesso de manutenção por túnel SSH) — o acesso público passa pelo
    # proxy reverso, via rede 'proxy' abaixo, apontando pro container na porta 80.
    ports:
      - "127.0.0.1:${PMA_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${PMA_CPUS:-0.5}"
          memory: ${PMA_MEM_LIMIT:-256M}
    networks:
      - dblab-net
      - proxy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dblab-app:latest
    container_name: dblab-app
    restart: unless-stopped
    env_file: .env
    # Logs de erro e backups gerados pelo /admin sobrevivem a rebuild/recreate do container.
    volumes:
      - dblab-app-logs:/var/www/html/storage/logs
      - dblab-app-backups:/var/www/html/storage/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      PMA_URL: ${PMA_URL:-}
      # Endereço interno (rede docker) só pro health check — nunca exibido na UI.
      PMA_INTERNAL_URL: ${PMA_INTERNAL_URL:-http://phpmyadmin}
      APP_KEY: ${APP_KEY}
      # "local" libera o DevUsersSeeder (contas com senha padrão) — sem a variável, vale production.
      APP_ENV: ${APP_ENV:-production}
      # Tuning do PHP-FPM/OPcache (docker/php-fpm-pool.conf, docker/php-performance.ini).
      # FPM_MAX_CHILDREN x ~40MB precisa caber em APP_MEM_LIMIT.
      FPM_MAX_CHILDREN: ${FPM_MAX_CHILDREN:-16}
      FPM_START_SERVERS: ${FPM_START_SERVERS:-4}
      FPM_MIN_SPARE_SERVERS: ${FPM_MIN_SPARE_SERVERS:-2}
      FPM_MAX_SPARE_SERVERS: ${FPM_MAX_SPARE_SERVERS:-6}
      OPCACHE_VALIDATE_TIMESTAMPS: ${OPCACHE_VALIDATE_TIMESTAMPS:-0}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-DB Lab Estudantes}
      MYSQL_EXTERNAL_PORT: ${MYSQL_PORT}
      DB_PUBLIC_HOST: ${DB_PUBLIC_HOST}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2.0}"
          memory: ${APP_MEM_LIMIT:-1G}
    networks:
      - dblab-net
      - proxy

  # Reinicia sozinho qualquer container marcado "unhealthy" pelo HEALTHCHECK do Docker —
  # sem isso, `restart: unless-stopped` só age se o processo cair de vez (crash), não se
  # ele travar mas continuar "vivo" (ex.: php-fpm engasgado, nginx no ar mas sem responder
  # rota nenhuma). Só reage a `mysql` e `app` (únicos com HEALTHCHECK definido); precisa
  # do socket do Docker pra poder reiniciar containers — acesso equivalente a root no host,
  # aceito de propósito aqui em troca de resiliência real (ver SECURITY.md).
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: dblab-autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: "${AUTOHEAL_CPUS:-0.25}"
          memory: ${AUTOHEAL_MEM_LIMIT:-64M}

# Volumes com nome fixo (persistem através de renomeações da pasta do compose).
volumes:
  dblab-mysql-data:
    name: dblab-mysql-data
  dblab-app-logs:
    name: dblab-app-logs
  dblab-app-backups:
    name: dblab-app-backups

networks:
  dblab-net:
    name: dblab-net
  # Rede do proxy reverso, já existente no servidor — não é criada por este projeto.
  proxy:
    external: true
    name: proxy
