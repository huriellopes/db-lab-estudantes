# Stack de produção (Contabo) — mesmo padrão dos outros projetos em /apps/*:
# app e phpMyAdmin são publicados pelo Nginx Proxy Manager já existente, através da rede
# externa 'proxy' (criada pela stack do NPM) — declarada abaixo, sem precisar de
# `docker network connect` manual depois do `up`.
#
# O MySQL é público (0.0.0.0), de propósito, pra dar pra conectar direto por qualquer
# SGBD local sem precisar de túnel SSH (decisão explícita — ver SECURITY.md, "MySQL
# público"). TLS disponível (certificado autoassinado que o próprio MySQL já gera) pra
# quem ligar "usar SSL" no cliente; não é obrigatório porque forçar isso quebraria a
# conexão interna da própria app sem retrabalho considerável.
services:
  mysql:
    image: mysql:8.0
    container_name: dblab-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - dblab-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    # Porta própria (13306) pra não colidir com outros bancos do servidor. Pública de
    # propósito (0.0.0.0) — conexão direta por SGBD local, sem túnel SSH.
    ports:
      - "${MYSQL_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dblab-net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: dblab-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    # 127.0.0.1 continua aberto (acesso via túnel SSH direto, sem depender do domínio
    # público) — o acesso público de verdade é feito pelo Nginx Proxy Manager, via rede
    # 'proxy' abaixo, apontando pro container na porta 80.
    ports:
      - "127.0.0.1:${PMA_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dblab-net
      - proxy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dblab-app:latest
    container_name: dblab-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      PMA_URL: ${PMA_URL:-}
      APP_KEY: ${APP_KEY}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-DB Lab Estudantes}
      MYSQL_EXTERNAL_PORT: ${MYSQL_PORT}
      DB_PUBLIC_HOST: ${DB_PUBLIC_HOST}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - dblab-net
      - proxy

# Volumes com nome fixo (persistem através de renomeações da pasta do compose).
volumes:
  dblab-mysql-data:
    name: dblab-mysql-data

networks:
  dblab-net:
    name: dblab-net
  # Rede do Nginx Proxy Manager, já existente no servidor — não é criada por este projeto.
  proxy:
    external: true
    name: proxy
