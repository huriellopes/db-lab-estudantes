services:
  mysql:
    image: mysql:8.0.46
    container_name: dblab_mysql
    restart: unless-stopped
    # --default-time-zone: fuso do servidor (afeta NOW()/CURRENT_TIMESTAMP e toda coluna
    # TIMESTAMP — inclusive nos schemas dos alunos, já que é uma configuração do servidor,
    # não por database). "America/Sao_Paulo" em vez de um offset fixo tipo "-03:00" porque
    # segue o fuso de verdade (o Brasil não tem horário de verão desde 2019, mas se voltar
    # um dia, esse nome já lida sozinho — testado: a imagem oficial do MySQL já carrega as
    # tabelas de fuso horário sozinha, não precisa de mysql_tzinfo_to_sql manual).
    command: --default-authentication-plugin=mysql_native_password --default-time-zone=America/Sao_Paulo
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dblab
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  phpmyadmin:
    image: phpmyadmin:5.2.3
    container_name: dblab_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dblab
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dblab_app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      PMA_URL: ${PMA_URL}
      APP_KEY: ${APP_KEY}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-DB Lab Estudantes}
      MYSQL_EXTERNAL_PORT: ${MYSQL_PORT}
      DB_PUBLIC_HOST: ${DB_PUBLIC_HOST:-localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    ports:
      - "${APP_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dblab
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  dblab:
    driver: bridge

volumes:
  mysql_data:
