services:
  mysql:
    image: mysql:8.0
    container_name: dblab_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dblab
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  phpmyadmin:
    image: phpmyadmin:5
    container_name: dblab_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dblab
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dblab_app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      PMA_URL: ${PMA_URL}
    ports:
      - "${APP_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dblab
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  dblab:
    driver: bridge

volumes:
  mysql_data:
